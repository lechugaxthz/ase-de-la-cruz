<section id="inicio" class="relative min-h-[90vh] flex items-center px-4 md:px-8 overflow-hidden">
  <!-- Contenedor del fondo (Imagen + Degradado) -->
  <div class="absolute inset-0 z-0">
    <!-- Degradado que va desde tu color 'surface' hasta transparente para fundirse con la imagen -->
    <div
      class="absolute inset-0 bg-gradient-to-r from-surface via-surface/80 to-transparent z-10"
    ></div>

    <!-- Imagen de fondo temporal (puedes cambiar la URL luego) -->
    <img
      class="w-full h-full object-cover object-right"
      src="https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&q=80"
      alt="Fondo de oficina"
    />
  </div>

  <!-- Contenido Principal (Texto y Botones) -->
  <div class="relative z-20 max-w-2xl mt-20 md:mt-0">
    <!-- Etiqueta superior -->
    <span class="text-secondary font-bold text-sm uppercase tracking-widest mb-4 block">
      Protección Patrimonial
    </span>

    <!-- Título principal -->
    <h1 class="text-5xl md:text-6xl font-extrabold mb-6 leading-tight">
      ¿Tu patrimonio está realmente protegido?
    </h1>

    <!-- Subtítulo -->
    <p class="text-neutral text-lg md:text-xl mb-8 leading-relaxed">
      Aseguramos lo que más valoras con estrategias personalizadas diseñadas por expertos en gestión
      de riesgos financieros y defensa legal.
    </p>

    <!-- Contenedor de Botones -->
    <div class="flex flex-col sm:flex-row gap-4">
      <!-- Botón de Acción Principal (Usando el terciario para que resalte) -->
      <button
        class="bg-tertiary px-8 py-4 rounded-lg font-bold hover:brightness-110 transition-all shadow-md active:scale-95"
      >
        Solicitar Asesoría
      </button>

      <!-- Botón Secundario (Borde primario, fondo transparente) -->
      <button
        class="border-2 border-primary bg-transparent px-8 py-4 rounded-lg font-bold hover:bg-primary/5 transition-all active:scale-95"
      >
        Explorar Coberturas
      </button>
    </div>
  </div>
</section>
